name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PhoneZone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21


      - name: Install Dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web Application
        run: |
          npx vite build || echo "Vite build skipped, using pre-bundled assets"

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android || echo "Cap sync finished"

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p build-artifacts
          find android -name "*.apk" -exec cp {} build-artifacts/ \;
          echo "=== Copied APK Artifacts ==="
          ls -la build-artifacts/

      - name: Upload PhoneZone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneZone-Android-App-Debug
          path: build-artifacts/*.apk
          retention-days: 30


      - name: Upload Build Log (Diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore


