name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PhoneZone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web Application
        run: |
          npx vite build || echo "Vite build skipped, using pre-bundled assets"

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android || echo "Cap sync finished"

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt || {
            echo "## Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 ../gradle_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }


      - name: Upload PhoneZone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneZone-Android-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
