name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build PhoneZone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21


      - name: Install Dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web Application
        run: |
          npx vite build || echo "Vite build skipped, using pre-bundled assets"

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android || echo "Cap sync finished"

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log || {
            echo "::error file=android/build.gradle::$(grep -E '(FAILURE|FAILED|Error:|error:|exception)' ../gradle_build.log | tail -n 5)"
            echo "=== FULL GRADLE ERROR LOG ==="
            cat ../gradle_build.log | tail -n 120
            exit 1
          }
          cd ..
          echo "=== Built APK files ==="
          find android/app/build/outputs -name "*.apk" || ls -la android/app/build/outputs/apk/debug/

      - name: Upload PhoneZone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneZone-Android-App-Debug
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log (Diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          if-no-files-found: ignore


