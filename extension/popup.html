<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhoneZone WhatsApp Dispatcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      color: #1f2937;
      background: #f9fafb;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: #e5e7eb;
      color: #374151;
    }
    .badge.active {
      background: #dcfce7;
      color: #15803d;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
    }
    .warning {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 8px;
      font-size: 11px;
      color: #92400e;
      margin-top: 12px;
      border-radius: 4px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      color: white;
    }
    button.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>PhoneZone WA <span id="statusBadge" class="badge">OFFLINE</span></h2>
  
  <label for="serverUrl">Server URL:</label>
  <input type="text" id="serverUrl" value="http://127.0.0.1:47713" />

  <label for="apiToken">API Bearer Token:</label>
  <input type="password" id="apiToken" placeholder="Paste token from PhoneZone Admin" />

  <div class="warning">
    <strong>Caution:</strong> Sending messages too fast can result in WhatsApp account suspension. PhoneZone enforces safe 25-70s delays and daily limits automatically.
  </div>

  <div class="buttons">
    <button id="saveBtn" class="secondary">Save</button>
    <button id="toggleBtn" class="primary">Start Dispatcher</button>
  </div>

  <div id="statusText" class="status-text">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
